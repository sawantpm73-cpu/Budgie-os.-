

name: BudgieOS ISO Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap

      - name: Build BudgieOS
        run: |
          sudo lb config noauto
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BudgieOS-Pro-Ultimate-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
